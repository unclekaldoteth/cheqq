[profile.default]
src = "src"
out = "out"
libs = ["../lib"]
remappings = [
    "@openzeppelin/contracts/=../lib/openzeppelin-contracts/contracts/",
    "forge-std/=../lib/forge-std/src/"
]
optimizer = true
optimizer_runs = 200

# Solidity compiler version (updated for OpenZeppelin EIP712)
solc = "0.8.24"

# Tempo network configurations
[rpc_endpoints]
tempo_testnet = "https://rpc.moderato.tempo.xyz"

[etherscan]
tempo_testnet = { key = "${TEMPO_EXPLORER_API_KEY}", url = "https://explore.tempo.xyz/api" }
